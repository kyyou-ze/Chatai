name: Unzip Project

on:
  push:
    paths:
      - "**/*.zip"
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Path file zip"
        required: false
        default: "personachat-ai.zip"

permissions:
  contents: write
  workflows: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek file zip
        run: |
          ZIP="${{ inputs.zip_file || 'personachat-ai.zip' }}"
          if [ ! -f "$ZIP" ]; then
            echo "File $ZIP gak ada"
            exit 0
          fi
          echo "ZIP_FILE=$ZIP" >> $GITHUB_ENV

      - name: Extract
        run: |
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-extract ${{ env.ZIP_FILE }}"
